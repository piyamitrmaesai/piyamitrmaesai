<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ช่วยนำเข้าข้อมูลจาก URL | P.C.R.C.</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#071426;color:#10233d;margin:0}.wrap{max-width:850px;margin:40px auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0004}.brand{display:flex;gap:14px;align-items:center}.brand img{width:72px;height:72px;object-fit:contain}.brand h1{font-size:1.35rem;margin:0;color:#071426}.muted{color:#637188}.grid{display:grid;gap:14px}.field label{font-weight:700;display:block;margin-bottom:7px}.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #d9e0e9;border-radius:10px;padding:12px;font:inherit}.field textarea{min-height:120px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;background:#ffd226;color:#071426}.btn2{background:#e9eef5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.result{margin-top:22px;border-top:1px solid #e5e9ef;padding-top:22px}.notice{background:#fff6c7;border-left:5px solid #ffd226;padding:14px;border-radius:8px;margin:16px 0}.status{font-weight:700;margin:10px 0}.preview{max-width:260px;border-radius:12px;display:none}
</style>
</head>
<body><main class="wrap">
<div class="brand"><img src="/assets/piyamitr-logo.png" alt=""><div><h1>ช่วยนำเข้าข้อมูลจากแหล่งภายนอก</h1><div class="muted">อ่านเฉพาะชื่อเรื่อง/คำอธิบาย/ภาพ Open Graph เพื่อใช้เป็นต้นร่าง ไม่เผยแพร่อัตโนมัติ</div></div></div>
<div class="notice">Facebook หรือเว็บไซต์บางแห่งอาจป้องกันการอ่านอัตโนมัติ หากดึงไม่ได้ให้เปิดต้นทางแล้วคัดลอกข้อมูลด้วยตนเอง</div>
<form id="form" class="grid"><div class="field"><label>URL แหล่งข้อมูล</label><input id="url" type="url" required placeholder="https://..."></div><button class="btn" type="submit">ดึงข้อมูล</button></form>
<div id="status" class="status"></div>
<section id="result" class="result" hidden>
<div class="grid"><div class="field"><label>หัวข้อ</label><input id="title"></div><div class="field"><label>คำอธิบาย/คำโปรย</label><textarea id="description"></textarea></div><div class="field"><label>URL ต้นทาง</label><input id="source"></div><div class="field"><label>ภาพที่พบ</label><input id="image"></div><img id="preview" class="preview" alt="ภาพตัวอย่าง"></div>
<div class="actions"><button id="copy" class="btn" type="button">คัดลอกข้อมูลเป็นต้นร่าง</button><a class="btn btn2" href="/admin/">เปิดระบบจัดการข่าว</a></div>
</section></main>
<script>
const f=document.querySelector('#form'),s=document.querySelector('#status'),r=document.querySelector('#result');
f.addEventListener('submit',async(e)=>{e.preventDefault();s.textContent='กำลังอ่านข้อมูล...';r.hidden=true;try{const res=await fetch('/.netlify/functions/import-url',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:document.querySelector('#url').value})});const data=await res.json();if(!res.ok)throw new Error(data.error||'ไม่สามารถดึงข้อมูลได้');title.value=data.title||'';description.value=data.description||'';source.value=data.url||'';image.value=data.image||'';if(data.image){preview.src=data.image;preview.style.display='block'}else preview.style.display='none';r.hidden=false;s.textContent='ดึงข้อมูลแล้ว กรุณาตรวจสอบกับต้นทางก่อนนำไปเผยแพร่';}catch(err){s.textContent='ไม่สำเร็จ: '+err.message}});
document.querySelector('#copy').addEventListener('click',async()=>{const text=`หัวข้อ: ${title.value}\nคำโปรย: ${description.value}\nแหล่งข้อมูล: ${source.value}\nภาพต้นทาง: ${image.value}`;await navigator.clipboard.writeText(text);s.textContent='คัดลอกแล้ว สามารถนำไปวางในข่าวฉบับร่างได้';});
</script></body></html>
